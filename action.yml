name: 'Promptfirewall Security Scan'
description: 'Scan for PII leaks and prompt injection patterns. Get an AI Safety Score (0-100) and grade (A-F).'
author: 'Timur Rakhmatullin'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  scan-paths:
    description: 'Paths to scan (space-separated)'
    required: false
    default: '.'
  include:
    description: 'File patterns to include (comma-separated, e.g. "*.py,*.ts,*.yaml")'
    required: false
    default: ''
  exclude:
    description: 'File patterns to exclude (comma-separated)'
    required: false
    default: ''
  detect-pii:
    description: 'Enable PII detection'
    required: false
    default: 'true'
  detect-injection:
    description: 'Enable prompt injection detection'
    required: false
    default: 'true'
  injection-threshold:
    description: 'Injection score threshold (0.0-1.0)'
    required: false
    default: '0.7'
  fail-on-findings:
    description: 'Fail the step if any findings are detected'
    required: false
    default: 'true'
  threshold:
    description: 'Minimum AI Safety Score to pass (0-100). Fails the check if score is below.'
    required: false
    default: '0'
  post-comment:
    description: 'Post results as a PR comment (requires GITHUB_TOKEN)'
    required: false
    default: 'false'
  badge-json:
    description: 'Output shields.io endpoint badge JSON'
    required: false
    default: 'false'
  sarif-upload:
    description: 'Upload SARIF results to GitHub Code Scanning'
    required: false
    default: 'true'

outputs:
  score:
    description: 'AI Safety Score (0-100)'
    value: ${{ steps.scan.outputs.score }}
  grade:
    description: 'Grade (A-F)'
    value: ${{ steps.scan.outputs.grade }}
  findings-count:
    description: 'Total number of findings'
    value: ${{ steps.scan.outputs.findings-count }}
  is-safe:
    description: 'Whether the scan passed (true/false)'
    value: ${{ steps.scan.outputs.is-safe }}
  badge-json:
    description: 'shields.io endpoint badge JSON'
    value: ${{ steps.scan.outputs.badge-json }}
  sarif-file:
    description: 'Path to generated SARIF report'
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    - name: Run promptfirewall scan
      id: scan
      shell: bash
      env:
        INPUT_SCAN_PATHS: ${{ inputs.scan-paths }}
        INPUT_INCLUDE: ${{ inputs.include }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_DETECT_PII: ${{ inputs.detect-pii }}
        INPUT_DETECT_INJECTION: ${{ inputs.detect-injection }}
        INPUT_INJECTION_THRESHOLD: ${{ inputs.injection-threshold }}
        INPUT_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_POST_COMMENT: ${{ inputs.post-comment }}
        INPUT_BADGE_JSON: ${{ inputs.badge-json }}
        INPUT_SARIF_UPLOAD: ${{ inputs.sarif-upload }}
        GITHUB_TOKEN: ${{ github.token }}
      run: ${{ github.action_path }}/action-entrypoint.sh

    - name: Upload SARIF to GitHub Code Scanning
      if: inputs.sarif-upload == 'true' && always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
      continue-on-error: true
