[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "promptfirewall-rs"
version = "0.1.0"
description = "PII detection + prompt injection firewall. Sub-millisecond, zero network, zero GPU."
readme = "../../README.md"
license = "MIT OR Apache-2.0"
authors = [{name = "Timur Rakhmatullin"}]
requires-python = ">=3.9"
keywords = ["pii", "prompt-injection", "firewall", "llm", "security", "gdpr", "hipaa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/TimurRakhmatullin86/promptfirewall"
Repository = "https://github.com/TimurRakhmatullin86/promptfirewall"
Issues = "https://github.com/TimurRakhmatullin86/promptfirewall/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "promptfirewall._internal"
